<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Profile</title>

    <link rel="stylesheet" href="../styles.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">

<i class="fa-solid fa-heart"></i>

<span>MatchMate</span>

</div>

<a href="../index.html">

<button id="themeBtn">

<i class="fa-solid fa-house"></i>

</button>

</a>

</nav>

</header>


<section
style="padding:70px 8%;">

<div
id="profileContainer">

</div>

</section>

<footer>

<h3>Adaptive Dating Recommendation System</h3>

<p>Java Capstone Project</p>

</footer>

<script>

const user = JSON.parse(localStorage.getItem("selectedUser"));

const container = document.getElementById("profileContainer");

if(user){

const compatibility = Math.floor(Math.random()*10)+90;

container.innerHTML = `

<div
style="
background:white;
border-radius:20px;
overflow:hidden;
max-width:900px;
margin:auto;
box-shadow:0 15px 35px rgba(0,0,0,.12);
">

<img
src="${user.image}"
style="
width:100%;
height:450px;
object-fit:cover;
">

<div
style="
padding:35px;
">

<h1>

${user.name}, ${user.age}

</h1>

<p>

📍 ${user.city}

</p>

<p>

👤 ${user.gender}

</p>

<p>

💰 Income ₹${user.income.toLocaleString()}

</p>

<h2
style="margin-top:30px;">

About

</h2>

<p>

${user.bio}

</p>

<h2
style="margin-top:30px;">

Likes

</h2>

<div
class="tags">

${user.likes.map(item=>`

<span>

${item}

</span>

`).join("")}

</div>

<h2
style="margin-top:30px;">

Dislikes

</h2>

<div
class="tags">

${user.dislikes.map(item=>`

<span>

${item}

</span>

`).join("")}

</div>

<h2
style="margin-top:30px;">

Hobbies

</h2>

<div
class="tags">

${user.hobbies.map(item=>`

<span>

${item}

</span>

`).join("")}

</div>

<h2
style="
margin-top:30px;
color:#ff3b7a;
">

❤️ Compatibility Score

${compatibility}%

</h2>

<div
style="
margin-top:35px;
display:flex;
gap:15px;
">

<button
onclick="likeProfile()"
style="
flex:1;
padding:15px;
background:#ff3b7a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
">

❤️ Like

</button>

<button
onclick="goBack()"
style="
flex:1;
padding:15px;
background:#4f46e5;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
">

← Back

</button>

</div>

</div>

</div>

`;

}else{

container.innerHTML=`

<div
style="
text-align:center;
padding:100px;
">

<h2>

No Profile Selected

</h2>

<p>

Return to Home Page.

</p>

<a href="../index.html">

<button
style="
margin-top:20px;
padding:15px 30px;
background:#ff3b7a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
">

Go Home

</button>

</a>

</div>

`;

}

function likeProfile(){

alert("❤️ You liked " + user.name);

}

function goBack(){

window.location.href="../index.html";

}

</script>

</body>

</html>
